name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: crivosistemas
          MYSQL_PASSWORD: crivosistemas
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Dá ao usuário de teste direito de criar bancos descartáveis
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'crivosistemas'@'%'; FLUSH PRIVILEGES;"
      - run: dotnet restore Crivosistemas.slnx
      - run: dotnet build Crivosistemas.slnx --no-restore -c Release
      - run: dotnet test Crivosistemas.slnx --no-build -c Release
        env:
          CRIVOSISTEMAS_TEST_DB_SERVER: "Server=127.0.0.1;Port=3306;User=crivosistemas;Password=crivosistemas;"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
