<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="6">
<title>Atualizando…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f6f7; color: #0f2a2e; text-align: center; padding: 24px; }
  .spin { width: 28px; height: 28px; border: 3px solid #cfd8da; border-top-color: #0f2a2e; border-radius: 50%; margin: 0 auto 20px; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { color: #5b6b6e; margin: 8px 0 0; }
</style>
</head>
<body>
  <main>
    <div class="spin" aria-hidden="true"></div>
    <h1 style="font-size:20px;margin:0">Estamos atualizando o sistema</h1>
    <p>Isso leva só alguns instantes. Esta página tenta de novo sozinha.</p>
  </main>
</body>
</html>
